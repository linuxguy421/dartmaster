name: Python checks

on:
  push:
    branches:
      - main
      - feat/darts-tournament-foundation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Check style
        run: ruff check app tests
