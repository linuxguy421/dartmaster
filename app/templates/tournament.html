<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dartmaster · Live tournament</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#1a2330;--panel2:#222e3d;--line:#344357;--muted:#a8b6c8;--text:#f1f5f9;--accent:#e5a33b;--good:#70c79a;--bad:#ef8585}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
header{padding:20px clamp(18px,4vw,48px);border-bottom:1px solid var(--line);background:#141c27;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
h1{font-size:25px;margin:0;letter-spacing:.04em}header p{color:var(--muted);margin:3px 0 0}
a{color:var(--accent)}main{max-width:1280px;margin:auto;padding:24px 20px 70px}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;border-radius:7px;padding:9px 12px}
select{background:#111923;color:var(--text);border:1px solid var(--line)}
button{background:var(--accent);color:#1c2025;border:0;font-weight:700;cursor:pointer}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.summary{color:var(--muted)}.summary strong{color:var(--text)}
.boards{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;overflow-x:auto;padding-bottom:8px}
.board{min-height:260px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:12px}
.board.unavailable,.board.disabled{opacity:.42}.board.in_progress{border-color:#8c6b35;background:#211f1a}.board.blocked{border-color:var(--bad)}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.board-head h2{font-size:20px;margin:0}.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--muted);text-transform:uppercase}
.status{color:var(--muted)}.match-id{font-size:12px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.teams{display:grid;gap:8px;margin:2px 0}.team{background:#111923;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:17px;font-weight:650}
.vs{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.actions button{flex:1;min-width:120px}
.blocked-reason{color:var(--bad);font-size:13px}
.ready-queue{margin:0 0 18px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.ready-queue h2{font-size:17px;margin:0 0 8px}.ready-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.ready-match{padding:12px;border:1px solid var(--line);border-radius:8px;background:#151e29}.ready-match strong{display:block;margin-bottom:6px}.ready-match .detail{color:var(--muted);font-size:13px;margin-bottom:10px}.ready-match .assign-row{display:flex;gap:8px;align-items:center}.ready-match select{min-width:0;flex:1}.recommendation{color:var(--good);font-size:12px;margin-bottom:7px}.bracket{margin-top:22px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.bracket h2{font-size:17px;margin:0 0 10px}.bracket-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px}.bracket-match{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#151e29}.bracket-match.in_progress{border-color:#8c6b35}.bracket-match.completed{border-color:#426b58}.bracket-match.waiting{opacity:.58}.bracket-match strong{display:block;font-size:13px;margin-bottom:5px}.bracket-match .detail{font-size:13px;color:var(--muted)}.bracket-match .winner{color:var(--good);font-weight:700}.results{margin-top:22px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.results h2{font-size:17px;margin:0 0 8px}.results ul{margin:0;padding-left:20px;color:var(--muted)}
#notice{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);max-width:min(700px,calc(100vw - 28px));padding:10px 15px;border:1px solid var(--line);background:#263446;border-radius:8px;display:none;z-index:3}
#notice.error{color:var(--bad)}#notice.show{display:block}
.complete{padding:16px;border:1px solid var(--good);border-radius:9px;color:var(--good);margin-bottom:16px}
@media(max-width:720px){.board{min-height:220px}header{align-items:flex-start}}
</style>
</head>
<body>
<header>
 <div><h1>DARTMASTER</h1><p>Live tournament control</p></div>
 <div class="controls"><button id="open-bracket" class="secondary" type="button">Open bracket ↗</button><a href="/">Registration / setup</a></div>
</header>
<main>
 <div class="toolbar">
  <div class="summary" id="summary">Loading tournament…</div>
  <div class="controls"><button id="refresh" class="secondary">Refresh</button></div>
 </div>
 <div id="champion"></div>
 <section class="ready-queue"><h2>Ready to play</h2><div id="ready-matches" class="ready-list"><p class="status">Loading ready matches…</p></div></section>
 <section class="boards" id="boards" aria-label="Four dartboards">
  <article class="board disabled">Loading board status…</article>
  <article class="board disabled">Loading board status…</article>
  <article class="board disabled">Loading board status…</article>
  <article class="board disabled">Loading board status…</article>
 </section>
 <section class="bracket"><h2>Bracket progress</h2><div id="bracket" class="bracket-list"><p class="status">Loading bracket…</p></div></section>
 <section class="results"><h2>Completed matches</h2><ul id="results"><li>No results yet.</li></ul></section>
</main>
<div id="notice" role="status" aria-live="polite"></div>
<script>
const tournamentId=location.pathname.split('/').filter(Boolean).pop();
const $=id=>document.getElementById(id);
let current=null,refreshing=false;
const selectedBoards=new Map();
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function notify(message,error=false){const n=$('notice');n.textContent=message;n.className=error?'show error':'show';setTimeout(()=>n.className='',3500);}
async function api(path,options={}){
 const response=await fetch(path,{headers:{'Content-Type':'application/json'},...options});
 if(!response.ok){let message='Request failed';try{message=(await response.json()).detail||message}catch{}throw new Error(message)}
 return response.json();
}
function boardMarkup(board){
 const match=board.match;
 const statusText={in_progress:'Match in progress',blocked:'Championship reset blocked',available:'Available · waiting for assignment'}[board.status];
 let body='<div class="status">'+statusText+'</div>';
 if(match){
  body='<div class="match-id">'+(match.match_id==='CHAMPIONSHIP'?'Championship Match': 'Match '+esc(match.match_id))+(match.phase==='reset'?' · Conditional reset':'')+'</div>'+
   '<div class="teams"><div class="team">'+esc(match.participants[0])+'</div><div class="vs">versus</div><div class="team">'+esc(match.participants[1])+'</div></div>'+
   (match.blocked_reason?'<div class="blocked-reason">'+esc(match.blocked_reason)+'</div>':'<div class="actions"><button data-winner="'+esc(match.participants[0])+'" data-board="'+board.board_id+'">'+esc(match.participants[0])+' won</button><button data-winner="'+esc(match.participants[1])+'" data-board="'+board.board_id+'">'+esc(match.participants[1])+' won</button></div>');
 }else{
  body='<div class="status">'+statusText+'</div>';
 }
 return '<article class="board '+board.status+'"><div class="board-head"><h2>Board '+board.board_id+'</h2><span class="pill">'+esc(board.status.replace('_',' '))+'</span></div>'+body+'</article>';
}
function render(data){
 current=data;
 $('summary').innerHTML='<strong>'+esc(data.bracket_file)+'</strong> · Four boards available · '+data.ready_matches.length+' matches ready for operator assignment';
 $('boards').innerHTML=data.boards.map(boardMarkup).join('');
 const recommendations=data.scheduler.recommended_boards;
 $('ready-matches').innerHTML=data.ready_matches.length?data.ready_matches.map((match,index)=>{
  const recommended=recommendations[index];
  const saved=selectedBoards.get(match.match_id);
  const selectedBoard=data.scheduler.free_boards.includes(saved)?saved:recommended;
  if(saved!==undefined&&!data.scheduler.free_boards.includes(saved))selectedBoards.delete(match.match_id);
  const options=data.scheduler.free_boards.map(board=>'<option value="'+board+'" '+(board===selectedBoard?'selected':'')+'>Board '+board+(board===recommended?' · recommended':'')+'</option>').join('');
  return '<article class="ready-match"><strong>'+(match.match_id==='CHAMPIONSHIP'?'Championship Match':'Match '+esc(match.match_id))+'</strong><div class="detail">'+esc(match.participants[0])+' vs '+esc(match.participants[1])+'</div>'+(recommended?'<div class="recommendation">Suggested board: '+recommended+'</div>':'')+'<div class="assign-row"><select aria-label="Board for '+esc(match.match_id)+'" data-board-select="'+esc(match.match_id)+'" '+(!data.scheduler.free_boards.length?'disabled':'')+'>'+options+'</select><button data-assign="'+esc(match.match_id)+'" '+(!data.scheduler.free_boards.length?'disabled':'')+'>Assign</button></div></article>';
 }).join(''):'<p class="status">No matches are currently ready. The bracket will unlock the next matches as results are recorded.</p>';
 $('champion').innerHTML=data.complete?'<div class="complete"><strong>Tournament complete</strong> · Champion: '+esc(data.championship.champion)+'</div>':'';
 $('bracket').innerHTML=data.bracket.map(match=>{
  const names=match.participants.map(esc);
  const detail=match.status==='waiting'
   ? names.join(' vs ')
   : names.join(' vs ');
  const outcome=match.status==='completed'
   ? '<div class="detail winner">Winner: '+esc(match.winner)+'</div>'
   : match.status==='reset_pending'
    ? '<div class="detail">First game complete · conditional reset pending</div>'
    : '<div class="detail">'+esc(match.status.replace('_',' '))+(match.board_id?' · Board '+match.board_id:'')+'</div>';
  return '<article class="bracket-match '+esc(match.status)+'"><strong>'+esc(match.label)+'</strong><div class="detail">'+detail+'</div>'+outcome+'</article>';
 }).join('');
 $('results').innerHTML=data.results.length?data.results.map(r=>'<li>'+esc(r.game_id)+': '+esc(r.winner)+' defeated '+esc(r.loser)+'</li>').join(''):'<li>No results yet.</li>';
}
async function refresh(){
 if(refreshing)return;refreshing=true;
 try{render(await api('/api/tournaments/'+encodeURIComponent(tournamentId)));}
 catch(err){notify(err.message,true)}
 finally{refreshing=false;}
}
async function act(path,method='POST',body){
 try{const data=await api(path,{method,body:body?JSON.stringify(body):undefined});render(data);notify('Tournament state updated.');return true;}
 catch(err){notify(err.message,true);return false;}
}
$('ready-matches').addEventListener('change',e=>{
 const select=e.target.closest('[data-board-select]');
 if(select)selectedBoards.set(select.dataset.boardSelect,Number(select.value));
});
$('ready-matches').addEventListener('click',async e=>{
 const target=e.target;
 if(!target.dataset.assign)return;
 const matchId=target.dataset.assign;
 const select=$('ready-matches').querySelector('[data-board-select="'+CSS.escape(matchId)+'"]');
 if(!select||!select.value){notify('Select an available board.',true);return;}
 const assigned=await act('/api/tournaments/'+tournamentId+'/boards/'+select.value+'/assign','POST',{match_id:matchId});
 if(assigned)selectedBoards.delete(matchId);
});
$('boards').addEventListener('click',async e=>{
 const target=e.target;
 if(target.dataset.winner){
  const winner=target.dataset.winner;
  if(!confirm('Record '+winner+' as the winner of this match?'))return;
  await act('/api/tournaments/'+tournamentId+'/boards/'+target.dataset.board+'/winner','POST',{winner});
 }
});
$('open-bracket').addEventListener('click',()=>window.open('/tournaments/'+encodeURIComponent(tournamentId)+'/bracket','_blank','noopener'));
$('refresh').addEventListener('click',refresh);
refresh();
setInterval(refresh,5000);
</script>
</body></html>
