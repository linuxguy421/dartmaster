<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pasadena Moose · Player Setup</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#1a2330;--surface-raised:#222e3d;--line:#344357;--muted:#a8b6c8;--text:#f1f5f9;--accent:#e5a33b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}header{padding:16px clamp(18px,4vw,48px);background:#141c27;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}main{width:min(1100px,calc(100% - 30px));margin:24px auto;display:grid;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}input,select,button{font:inherit;padding:9px 11px;border-radius:7px;border:1px solid var(--line);background:#111923;color:var(--text)}button{background:var(--accent);color:#1c2025;font-weight:700;cursor:pointer}button.secondary{background:#222e3d;color:var(--text)}button.danger{background:#6b3030;color:white}.form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.form label{display:grid;gap:4px}.form input{min-width:200px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}tr.inactive{opacity:.55}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{color:var(--muted)}a{color:var(--accent)}.actions a.button{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:#222e3d;color:var(--text);font-weight:700;text-decoration:none}.actions a.button:hover{border-color:var(--accent)}.list{display:grid;gap:8px}.source-row{display:flex;gap:8px;align-items:center}.source-row input{width:auto}@media(max-width:600px){td,th{padding:7px 4px;font-size:13px}.form input{min-width:0;width:100%}}

/* Shared Pasadena Moose tournament masthead */
.site-header{min-height:104px;padding:16px clamp(18px,3vw,36px)!important;display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;background:linear-gradient(110deg,rgba(17,26,38,.97),rgba(25,37,52,.91))!important;border-bottom:1px solid rgba(229,163,59,.42)!important;box-shadow:0 8px 28px rgba(0,0,0,.24);backdrop-filter:blur(10px)}
.brand-lockup{display:flex;align-items:center;gap:16px;min-width:0}.brand-mark{display:block;width:68px;height:68px;flex:0 0 68px;object-fit:contain;border-radius:50%;}.brand-copy{min-width:0}.brand-kicker{font-size:10px;font-weight:800;letter-spacing:.24em;color:var(--accent);line-height:1.3}.site-header h1{margin:2px 0 1px;font-size:clamp(19px,2.2vw,25px);font-weight:850;letter-spacing:.075em;line-height:1.2;color:var(--text)}.site-header p{margin:4px 0 0;color:var(--muted);font-size:13px}.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap}.header-actions a{font-size:13px;font-weight:700;text-decoration:none}.header-actions .button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface-raised);color:var(--text);font-size:13px;font-weight:700;line-height:1.3;text-decoration:none}.header-actions .button:hover{border-color:var(--accent);color:var(--accent)}.header-actions button{font:inherit;min-height:38px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface-raised);color:var(--text);font-size:13px;font-weight:700;line-height:1.3}.header-actions button:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:560px){.site-header{align-items:flex-start;padding:13px 16px!important;gap:12px}.brand-lockup{gap:12px}.brand-mark{width:54px;height:54px;flex-basis:54px}.header-actions{width:100%;justify-content:flex-start;padding-left:66px}}

</style></head><body>
<header class="site-header">
  <div class="brand-lockup">
   <img class="brand-mark" src="/assets/logo.png" alt="Logo">
   <div class="brand-copy"><div class="brand-kicker">PASADENA MOOSE</div><h1>DART TOURNAMENT</h1><p>Player setup · Manage your reusable player roster</p></div>
  </div>
  <nav class="header-actions"><a class="button secondary" href="/">Registration</a><a class="button secondary" href="/historical-results">Historical Results</a><a class="button secondary" href="/setup" aria-current="page">Setup</a></nav>
 </header>
<main>
<section class="panel"><h2>Add a saved player</h2><form id="form" class="form"><label>Name<input id="name" maxlength="80" required placeholder="Player name"></label><label>Sex<select id="gender"><option value="female">Female</option><option value="male">Male</option></select></label><button>Add player</button></form><p id="status" class="status" aria-live="polite"></p></section>
<section class="panel"><h2>Saved players</h2><p class="status">Inactive players remain saved but are excluded from registration selection.</p><div id="list">Loading…</div></section></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok){let e='Request failed';try{e=(await r.json()).detail||e}catch{}throw Error(e)}return r.status===204?null:r.json()}
async function load(){const players=await api('/api/saved-players');$('list').innerHTML=players.length?'<table><thead><tr><th>Name</th><th>Sex</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+players.map(p=>'<tr class="'+(!p.active?'inactive':'')+'" data-id="'+p.player_id+'"><td><input class="edit-name" value="'+esc(p.display_name)+'" maxlength="80"></td><td><select class="edit-gender"><option value="female" '+(p.gender==='female'?'selected':'')+'>Female</option><option value="male" '+(p.gender==='male'?'selected':'')+'>Male</option></select></td><td>'+(p.active?'Active':'Inactive')+'</td><td class="actions"><button class="save">Save</button><button class="secondary toggle">'+(p.active?'Deactivate':'Activate')+'</button><button class="danger delete">Delete</button></td></tr>').join('')+'</tbody></table>':'<p class="status">No saved players yet.</p>'}
$('form').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/saved-players',{method:'POST',body:JSON.stringify({display_name:$('name').value.trim(),gender:$('gender').value})});$('name').value='';$('status').textContent='Player saved.';await load()}catch(e){$('status').textContent=e.message}});
$('list').addEventListener('click',async e=>{const row=e.target.closest('tr[data-id]');if(!row)return;const id=row.dataset.id;try{if(e.target.classList.contains('save')){await api('/api/saved-players/'+id,{method:'PUT',body:JSON.stringify({display_name:row.querySelector('.edit-name').value,gender:row.querySelector('.edit-gender').value,active:row.cells[2].textContent.trim()==='Active'})})}else if(e.target.classList.contains('toggle')){const active=row.cells[2].textContent.trim()!=='Active';await api('/api/saved-players/'+id,{method:'PUT',body:JSON.stringify({display_name:row.querySelector('.edit-name').value,gender:row.querySelector('.edit-gender').value,active})})}else if(e.target.classList.contains('delete')){if(!confirm('Delete this saved player permanently?'))return;await api('/api/saved-players/'+id,{method:'DELETE'})}await load()}catch(e){$('status').textContent=e.message}});
load();
</script></body></html>
